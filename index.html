        </div>
      </div>

      </div>
    </div>

    <div class="tabbar-inner">
      <button class="tab-btn" type="button" data-tab="home" aria-label="Home">

      </button>

      </button>
      <button class="tab-btn" type="button" data-tab="quiz" aria-label="Quiz">
        <span class="tab-ico" aria-hidden="true">❓</span><span>Quiz</span>
      </button>
      <button class="tab-btn" type="button" data-tab="review" aria-label="Review due words">
        <span class="tab-ico" aria-hidden="true">🔁</span><span>Review</span>
        <span id="reviewBadge" class="tab-badge" hidden></span>
      </button>
    </div>
  </nav>

  <div id="sheetHost" class="sheet-host" hidden></div>
